services:
  - type: web
    name: ar-navigation-api
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
